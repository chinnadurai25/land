<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Green Valley Avenue plot in Othakadai">
  <defs>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4E8DF"/>
      <stop offset="100%" stop-color="#F2F4E9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#s2)"/>
  <path d="M0 430 Q400 365 820 420 T1200 400 L1200 540 L0 540 Z" fill="#5E856B" opacity="0.55"/>
  <rect y="500" width="1200" height="400" fill="#568755"/>
  <!-- Paved blacktop avenue leading into distance -->
  <polygon points="520,500 680,500 980,900 220,900" fill="#4B5558"/>
  <line x1="600" y1="510" x2="600" y2="890" stroke="#FAF9F5" stroke-width="6" stroke-dasharray="40 30"/>
  <!-- Left & right green residential plots -->
  <polygon points="0,530 500,520 210,880 0,880" fill="#77A362"/>
  <polygon points="700,520 1200,530 1200,880 990,880" fill="#7CA867"/>
  <!-- Avenue neem trees -->
  <g fill="#245B45">
    <rect x="330" y="455" width="14" height="105" fill="#594533"/>
    <circle cx="337" cy="420" r="65"/>
    <rect x="850" y="450" width="14" height="110" fill="#594533"/>
    <circle cx="857" cy="415" r="68"/>
    <rect x="190" y="490" width="18" height="145" fill="#594533"/>
    <circle cx="199" cy="445" r="82" fill="#1D4C39"/>
    <rect x="985" y="485" width="18" height="150" fill="#594533"/>
    <circle cx="994" cy="440" r="84" fill="#1D4C39"/>
  </g>
</svg>
