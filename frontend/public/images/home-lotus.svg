<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Lotus Garden Home residential residence in Othakadai">
  <defs>
    <linearGradient id="s6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4E6EA"/>
      <stop offset="100%" stop-color="#F2F4EA"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#s6)"/>
  <rect y="640" width="1200" height="260" fill="#5F8D57"/>
  <!-- Driveway -->
  <polygon points="480,680 760,680 880,900 380,900" fill="#D9D6CA"/>
  <!-- Modern South Indian warm-ivory home -->
  <rect x="240" y="370" width="720" height="310" rx="12" fill="#FAF7EE" stroke="#CBD4C5" stroke-width="4"/>
  <!-- Roof overhang -->
  <polygon points="200,375 600,255 1000,375" fill="#245B45"/>
  <rect x="230" y="365" width="740" height="22" fill="#183D2E"/>
  <!-- Upper terrace pergola -->
  <rect x="330" y="295" width="260" height="75" fill="#F2EFE4" stroke="#BFCAB9" stroke-width="3"/>
  <!-- Verandah & wooden door -->
  <rect x="520" y="490" width="160" height="190" rx="6" fill="#7D5435"/>
  <rect x="305" y="455" width="150" height="135" rx="6" fill="#B9D4DA" stroke="#245B45" stroke-width="5"/>
  <rect x="745" y="455" width="150" height="135" rx="6" fill="#B9D4DA" stroke="#245B45" stroke-width="5"/>
  <!-- Garden shrubs -->
  <circle cx="220" cy="650" r="65" fill="#2B674B"/>
  <circle cx="980" cy="645" r="72" fill="#2B674B"/>
  <circle cx="340" cy="670" r="40" fill="#468963"/>
  <circle cx="860" cy="670" r="42" fill="#468963"/>
</svg>
